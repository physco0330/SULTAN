# Despliegue del API + frontend en Render (un solo dominio, sin CORS).
#
# Datos: Firestore (Firebase) y fotos: Cloudinary. El servicio no guarda nada
# en disco, así que funciona en el plan gratuito de Render.
#
# Valores secretos (FIREBASE_SERVICE_ACCOUNT_JSON, CLOUDINARY_URL, SITE_URL...)
# se introducen en el panel de Render: nunca van en este archivo.
services:
  - type: web
    name: sultan-black
    runtime: node
    plan: free

    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs

    # La API sirve /api y también el build de Vite desde el mismo dominio.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "24"

      - key: NODE_ENV
        value: production

      # Render define NODE_ENV=production también durante el build, y npm
      # entonces omitiría las devDependencies (vite, typescript) necesarias para
      # `npm run build`. Esta variable fuerza su instalación.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

      # Contenido completo del JSON de la cuenta de servicio de Firebase.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Firma los tokens de admin y el token de seguimiento de pedidos.
      # Render genera uno automáticamente: nunca lo subas al repositorio.
      - key: SULTAN_SECRET
        generateValue: true

      # Cloudinary: cloudinary://clave:secreto@nombre_de_nube
      - key: CLOUDINARY_URL
        sync: false

      # Dominio propio del frontend. Ej.: https://sultanblack.com.co
      - key: SITE_URL
        sync: false

      # Solo si el frontend vive en OTRO dominio; separado por comas.
      - key: ALLOWED_ORIGINS
        sync: false

    autoDeploy: true
